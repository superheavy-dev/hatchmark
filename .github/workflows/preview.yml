name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_PR: ${{ github.event.pull_request.number }}
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.PREVIEW_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the preview site
        run: pnpm build && pnpm --filter @hatchmark/preview run site

      - name: Deploy the pull request preview
        id: deploy
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @hatchmark/preview run deploy pr

      - name: Deploy main to production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @hatchmark/preview run deploy production

      - name: Comment the preview URL on the pull request
        if: steps.deploy.outputs.alias_url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          VERSION_URL: ${{ steps.deploy.outputs.version_url }}
        with:
          script: |
            const marker = "<!-- hatchmark-preview -->";
            const { ALIAS_URL, VERSION_URL, PREVIEW_SHA } = process.env;
            const body = [
              marker,
              `**Preview:** ${ALIAS_URL}`,
              "",
              `Built from ${PREVIEW_SHA}.${VERSION_URL ? ` This exact version: ${VERSION_URL}` : ""}`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
